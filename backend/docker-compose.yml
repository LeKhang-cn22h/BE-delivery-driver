services:
  gateway:
    build:
      context: ./gateway/app
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      - RECEIVE_ORDERS_SERVICE_URL=http://receive_orders_service:8001
      - TRANSPORT_SERVICE_URL=http://transport_service:8002
      - AUTH_SERVICE_URL=http://auth_service:7000
    volumes:
      - ./gateway/app:/app
    networks:
      - app_network
    depends_on:
      - receive_orders_service
      - auth_service
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # RabbitMQ Service
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Receive Orders Service
  receive_orders_service:
    build:
      context: ./services/receive_orders/app
      dockerfile: Dockerfile
    container_name: receive_orders_service
    expose:
      - "8001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_QUEUE_NAME=order_queue
      - RABBITMQ_EXCHANGE_NAME=orders_exchange
      - RABBITMQ_ROUTING_KEY=new.order
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    volumes:
      - ./services/receive_orders/app:/app
    networks:
      - app_network
    env_file:
      - ./services/receive_orders/app/.env
    depends_on:
      - rabbitmq
      - redis
      - kafka
    restart: unless-stopped

  auth_service:
    build:
      context: ./services/auth/app
      dockerfile: Dockerfile
    container_name: auth_service
    expose:
      - "7000"
    volumes:
      - ./services/auth/app:/app
    networks:
      - app_network
    env_file:
      - ./services/auth/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  routing_service:
      build:
        context: ./services/routing-service/app
        dockerfile: Dockerfile
      container_name: routing_service
      expose:
        - "8386"
      volumes:
        - ./services/routing-service/app:/app
      networks:
        - app_network
      env_file:
        - ./services/routing-service/app/.env
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8386/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  kafka_to_datalake:
    build:
      context: ./services/kafka_to_datalake/app
      dockerfile: Dockerfile
    container_name: kafka_to_datalake
    depends_on:
      - kafka
      - minio
    networks:
      - app_network
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=datalake



  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app_network
    depends_on:
      - zookeeper
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 5

  # MinIO
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

    # PostgreSQL Data Warehouse
  postgres_warehouse:
    image: postgres:15-alpine
    container_name: postgres_warehouse
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_warehouse_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d warehouse" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped



    # ETL Processor: DataLake (MinIO) -> Data Warehouse (PostgreSQL)
  etl_processor:
    build:
      context: ./services/etl_processor/app
      dockerfile: Dockerfile
    container_name: etl_processor
    depends_on:
      - postgres_warehouse
#        condition: service_healthy
      - minio
#        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped
    environment:
      # MinIO (Source)
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET=datalake
      # PostgreSQL (Target)
      - POSTGRES_HOST=postgres_warehouse
      - POSTGRES_PORT=5432
      - POSTGRES_DB=warehouse
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      # Processing Config
      - PROCESSING_INTERVAL=300
      - LOG_LEVEL=INFO

    # ========== BUSINESS INTELLIGENCE ==========
  postgres_metabase:
    image: postgres:15-alpine
    container_name: postgres_metabase
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_metabase_data:/var/lib/postgresql/data
    networks:
      - app_network

    # Metabase (BI Tool)
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: admin
      MB_DB_PASS: admin123
      MB_DB_HOST: postgres_metabase
    depends_on:
      - postgres_metabase
#        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
    networks:
      - app_network
    restart: unless-stopped


networks:
  app_network:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  zookeeper_logs:
  minio_data:
  postgres_warehouse_data:
  postgres_metabase_data:
  metabase_data:
